sources:
  tee_time_sniper:
    type: journald
    include_units:
      - tee-time-sniper

transforms:
  parse_pino:
    type: remap
    inputs:
      - tee_time_sniper
    source: |
      parsed, err = parse_json(.message)
      if err == null {
        . = merge!(., parsed)
      }

sinks:
  betterstack:
    type: http
    inputs:
      - parse_pino
    uri: https://in.logs.betterstack.com
    method: post
    encoding:
      codec: json
    headers:
      Authorization: Bearer Rp6Y66PZkV3dMQR81JEayFTB
